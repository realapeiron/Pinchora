nextest-version = "0.9.151"

[profile.default]
# Bound process-local pool fan-out on four-core CI runners.
test-threads = 4
retries = 0
fail-fast = false
# The instrumented privacy stress test took 375 seconds; regular tests exceed 80.
# Allow 10 minutes, then 10 seconds to exit.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "10s" }

[profile.local]
inherits = "default"

[profile.ci]
inherits = "default"
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = true

[profile.nightly]
inherits = "ci"
retries = 2
flaky-result = "fail"

[profile.nightly.junit]
path = "junit.xml"

# These module groups only improve scheduling; PostgreSQL session locks protect fixtures.
[test-groups]
sim-basics = { max-threads = 1 }
sim-board = { max-threads = 1 }
sim-branding = { max-threads = 1 }
sim-leveling = { max-threads = 1 }
