nextest-version = "0.9.151"

[profile.default]
# Bound process-local pool fan-out on four-core CI runners.
test-threads = 4
retries = 0
fail-fast = false
# The instrumented privacy stress test took 375 seconds; regular tests exceed 80.
# Allow 10 minutes, then 10 seconds to exit.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "10s" }

[profile.local]
inherits = "default"

[profile.ci]
inherits = "default"
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = true

[profile.nightly]
inherits = "ci"
retries = 2
flaky-result = "fail"

[profile.nightly.junit]
path = "junit.xml"

# DB integration tests include global cleanup and process-local fixture locks.
# Reserve every slot so their sweeps cannot consume command/web fixtures.
[[profile.default.overrides]]
filter = 'package(pinchora-db) & kind(test)'
threads-required = "num-test-threads"

# These Redis unit tests assert ownership of the global stats-flush lease.
# Cargo runs their binary before the simulator; preserve that exclusivity.
[[profile.default.overrides]]
filter = 'package(pinchora-cache) & test(/^stats::tests::/)'
threads-required = "num-test-threads"

# These flows span two fixture locks: both game tickers, or temp rooms and voice XP.
# Reserve the runner so neither domain can consume the other flow's fixtures.
[[profile.default.overrides]]
filter = 'binary(simulate) & (test(/^quick::quick_public_(english|turkish)_flows$/) | test(=tempvoice::voice_xp_is_still_paid_in_a_temp_room))'
threads-required = "num-test-threads"
test-group = "@global"

# Temp-voice fixtures share a Redis cleanup set even when their mocks are separate.
[test-groups.temp-voice]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(simulate) & test(/^tempvoice::/)'
test-group = "temp-voice"

# Keep these filters aligned with the fixture locks in simulate.rs and its modules.
# The Rust locks still serialize cargo test threads; groups serialize nextest processes.
[test-groups.bans]
max-threads = 1

[[profile.default.overrides]]
filter = '''binary(simulate) & (
    test(/(^|::)a_temporary_ban_lifted_by_hand_never_lifts_a_newer_ban$/) |
    test(/(^|::)delayed_unban_events_preserve_the_exact_newer_ban$/) |
    test(/(^|::)temporary_bans_end_on_the_ticker_with_a_case_of_their_own$/)
)'''
test-group = "bans"

[test-groups.birthdays]
max-threads = 1

[[profile.default.overrides]]
filter = '''binary(simulate) & (
    test(/(^|::)birthday_keeps_existing_roles_and_obeys_module_switch$/) |
    test(/(^|::)birthday_role_rechecks_safety_and_expired_grants_never_reappear$/) |
    test(/(^|::)deleting_data_removes_the_birthday_role_before_erasing_its_timer$/) |
    test(/(^|::)local_midnight_posts_one_pixel_card_and_one_gift$/) |
    test(/(^|::)thousand_birthdays_are_batched_after_restart_with_safe_mentions$/)
)'''
test-group = "birthdays"

