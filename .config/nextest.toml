max-threads = 1

[[profile.default.overrides]]
filter = '''binary(simulate) & (
    test(/(^|::)a_bottle_is_opened_by_the_first_who_clicks_and_the_message_is_read_aloud$/) |
    test(/(^|::)a_chat_spawn_waits_while_the_channel_has_an_open_drop$/) |
    test(/(^|::)collection_claim_components_cannot_cross_guild_or_channel_boundaries$/) |
