# Sunucu istatistikleri (/stats, /counters) ve istatistik kartları. Kart etiketlerini piksel yazı büyük harfle çizer.

[module]
stats = "İstatistikler"

[stats]
expired = "Bu düğmelerin süresi doldu. /stats komutunu yeniden çalıştır."
