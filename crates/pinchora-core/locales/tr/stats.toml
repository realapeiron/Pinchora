too-many-members = "⚠️ Bu sunucuda 10.000'den fazla üye var; tek tek saymak için çok fazla. Üyeler, Şu an çevrimiçi ve Takviyeler sayaçları yine çalışır."
role-gone = "⚠️ Saydığı rol silinmiş. `/counters add` ile başka bir rol seç."
other = "⚠️ Son yeniden adlandırma gerçekleşmedi; 10 dakika sonra yeniden denenecek."

