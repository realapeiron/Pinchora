unknown-user = "böyle bir kullanıcı yok"
unknown-ban = "bu kullanıcı yasaklı değil"
said-no = "reddetti"
unreachable = "Discord'a ulaşılamadı"
bad-time = "bu zaman Discord'a gönderilemiyor"

# Permission names, as Discord's own settings show them.
[mod.perm]
ban-members = "Üyeleri Yasakla"
kick-members = "Üyeleri At"
timeout-members = "Üyelere Zaman Aşımı Uygula"
manage-messages = "Mesajları Yönet"
manage-channels = "Kanalları Yönet"
manage-nicknames = "Kullanıcı Adlarını Yönet"
manage-roles = "Rolleri Yönet"

# What was tried, for the refusals below.
[mod.verb]
ban = "yasaklamak"
kick = "atmak"
timeout = "susturmak"
untimeout = "susturmadan çıkarmak"
warn = "uyarmak"
rename = "yeniden adlandırmak"

[mod.refusal]
yourself = "Kendini {verb} mümkün değil."
me = "Beni {verb} mümkün değil."
owner = "Sunucu sahibini {verb} mümkün değil."
above = "Bu üyeyi {verb} için en yüksek rolünün onunkinden yukarıda olması gerekir."
above-me = "Bu üyeyi {verb} için benim rolümün onunkinden yukarıda olması gerekir. Sunucu Ayarları > Roller bölümünde rolümü onunkinin üstüne sürükle, sonra tekrar dene."

# The kinds of cases, by `CaseKind::key`.
[mod.kind]
ban = "Yasak"
unban = "Yasak kaldırma"
kick = "Atma"
timeout = "Susturma"
untimeout = "Susturma kaldırma"
warn = "Uyarı"
unwarn = "Uyarı kaldırma"
purge = "Mesaj temizliği"
slowmode = "Yavaş mod"
lock = "Kilit"
unlock = "Kilit açma"
nick = "Takma ad"
role_add = "Rol verme"
role_remove = "Rol alma"

# What a case did, in one line.
[mod.summary]
ban = "{who} yasaklandı"
ban-for = "{who} {duration} süreyle yasaklandı"
unban = "{who} artık yasaklı değil"
kick = "{who} sunucudan atıldı"
timeout = "{who} susturuldu"
timeout-for = "{who} {duration} süreyle susturuldu"
untimeout = "{who} için susturma kaldırıldı"
warn = "{who} uyarıldı"
unwarn = "{who} için bir uyarı geri alındı ({details})"
purge = "{channel}: {details}"
slowmode = "{channel} kanalında yavaş mod: {details}"
lock = "{channel} kilitlendi"
unlock = "{channel} kanalının kilidi açıldı"
nick = "{who}: {details}"
role_add = "{who} artık {details} rolüne sahip"
role_remove = "{who} artık {details} rolüne sahip değil"
other = "{who}: {kind}"

[mod.details]
unwarn = "vaka #{number}"
purged = { other = "{count} mesaj silindi" }
filters = "{purged} ({filters})"
from = "gönderen: {name}"
from-bots = "botlardan"
containing = "içinde {text} geçen"
with-links = "bağlantılı"
with-attachments = "ekli"
slowmode-off = "kapalı"
slowmode-every = "{duration} aralıkla bir mesaj"
nick-set = "takma adı {nick} oldu"
nick-reset = "takma adı sıfırlandı"

# The mod-log entry, and what /mod case shows.
[mod.case]
title = "Vaka #{number} · {label}"
member = "Üye"
channel = "Kanal"
moderator = "Moderatör"
reason = "Sebep"
no-reason = "*Sebep belirtilmedi*"
duration = "Süre"
ends = "{duration} · bitiş {when}"
status = "Durum"
removed = "Geri alındı"
dm = "Özel mesaj"
not-delivered = "İletilemedi"
id = "ID {id}"
reply = "{summary} · vaka #{number}"

# The direct message to the member.
[mod.dm]
a-server = "bir sunucu"
ban-for = "**{server}** sunucusundan bir süreliğine yasaklandın"
ban = "**{server}** sunucusundan yasaklandın"
kick = "**{server}** sunucusundan atıldın"
timeout = "**{server}** sunucusunda susturuldun"
untimeout = "**{server}** sunucusundaki susturman kaldırıldı"
warn = "**{server}** sunucusunda uyarı aldın"
other = "Bir moderatör **{server}** sunucusundaki üyeliğinle ilgili işlem yaptı"
ban-failed = "**{server}** sunucusunun bir moderatörü seni yasaklamaya çalıştı ama işlem gerçekleşmedi. Hâlâ üyesin."
