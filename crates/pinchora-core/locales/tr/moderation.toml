# Short durations: 1 hafta 2 gün, 2 sa 30 dk, 45 sn.
[mod.unit]
w = "{n} hafta"
d = "{n} gün"
h = "{n} sa"
m = "{n} dk"
s = "{n} sn"

# One rung of the warn ladder.
[mod.rung]
line = { other = "{count} uyarı → {what}" }
timeout-for = "{duration} susturma"
timeout = "susturma"
ban-for = "{duration} yasak"
ban = "kalıcı yasak"
kick = "atma"

