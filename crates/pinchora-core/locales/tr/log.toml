# The server log: its entries (in the server's language) and the /config log summaries.

[log]
prefix = "Sunucu kaydı: {summary}"
head-on = "**açık** · {channel}"
head-off = "**kapalı** · `/config log` ile bir kanal seç"
category-line = "> {category}: {on}/{total} açık · {channel}"
log-channel = "kayıt kanalı"
no-channel = "kanal yok"
none = "*yok*"
id = "ID {id}"
yes = "evet"
no = "hayır"
by = "Yapan"
reason = "Sebep"
more = { other = "ve {count} tane daha" }
the-server = "sunucu"
for-everyone = "@everyone için"
for = "{who} için"
by-actor = "{target} · yapan: {actor}"

# The log's categories and events, by `LogCategory::key` and `LogEvent::key`.
[log.category]
members = "Üyeler"
messages = "Mesajlar"
roles = "Roller"
channels = "Kanallar ve alt başlıklar"
voice = "Ses"
moderation = "Moderasyon"
server = "Sunucu"
invites = "Davetler"
emojis = "Emojiler ve çıkartmalar"

[log.event]
member_join = "Üye katıldı"
member_leave = "Üye ayrıldı"
nickname = "Takma ad değişti"
username = "Kullanıcı adı ya da görünen ad değişti"
avatar = "Avatar değişti"
message_edit = "Mesaj düzenlendi"
message_delete = "Mesaj silindi"
message_bulk_delete = "Mesajlar toplu silindi"
role_create = "Rol oluşturuldu"
role_delete = "Rol silindi"
role_update = "Rol değişti"
member_roles = "Üyenin rolleri değişti"
channel_create = "Kanal oluşturuldu"
channel_delete = "Kanal silindi"
channel_update = "Kanal değişti"
channel_permissions = "Kanal izinleri değişti"
thread_create = "Alt başlık oluşturuldu"
thread_delete = "Alt başlık silindi"
thread_update = "Alt başlık değişti"
voice_join = "Sese katıldı"
voice_leave = "Sesten ayrıldı"
