# What the bot says when a server wrote no message of its own: the same text as the DEFAULT_* constants.
[events]
default-welcome = "**{server}** sunucusuna hoş geldin, {user}!"
default-goodbye = "👋 **{user}**, **{server}** sunucusundan ayrıldı."
default-levelup = "🎉 {user} **{level}. seviyeye** ulaştı!"
default-welcome-title = "Hoş geldin"
the-server = "sunucu"

[card.welcome]
to-member = "{server} · {number}. üye"
to = "{server}"

[card.levelup]
title = "SEVİYE ATLADI!"
jump = "SV {from} >> {to}"

[log]
bot-joined = "Bot katıldı"
member-joined = "Üye katıldı"
