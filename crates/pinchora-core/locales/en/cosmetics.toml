[customize.showcase]
title = "Profile showcase"
empty = "Empty"
soulbound = "{rarity} · Soulbound"
fish-description = "{rarity} · best {best} cm · caught {caught}"
pet-description = "{species} · level {level}"
summary = "**Fish** {fish} · **Pet** {pet} · **Furniture** {furniture} · **House** {house}"
house-shown = "shown"
house-hidden = "hidden"
empty-showcase = "\nNothing is on your showcase, so your card looks as it always did."
clear-slot = "Clear slot"
hide-house = "Hide house"
show-house = "Show house"
clear-all = "Clear all"
slot-menu = "Slot to edit…"
saved = "Saved. **{name}** is on your profile card."
cleared-slot = "Cleared. {slot} is off your card."
no-house = "You have no house yet. Open it with `/house edit` first."
house-off = "Your house is off your card."
house-on = "Your house is on your card."
cleared-all = "Cleared. Your card looks as it always did."
expired = "This button has expired."

[customize.showcase.slot]
fish = "Favourite fish"
pet = "Pet"
furniture = "Furniture"

[customize.showcase.placeholder]
fish = "Pick a favourite fish…"
pet = "Pick a pet…"
furniture = "Pick a furniture item…"

[customize.showcase.nothing]
fish = "Catch a fish with /fish first"
pet = "Adopt a pet with /pet first"
furniture = "Buy furniture with /shop first"

[customize.unlock]
title = "Badge unlocked: {name}"
more = "…and {count} more. "
hint = "See your collection with /customize badges"
announce = "{user} unlocked a badge!"

# Words the cards draw themselves, in capitals.
[card.badges]
title = "BADGES"

[card.showcase]
