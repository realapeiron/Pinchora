# The word and prompt party games (/party): the lobby they share, Hot Pearl, Acronym Tide, Caption the
# Postcard, Wordle Race, Would You Rather and Truth or Dare, the cards they draw, /party stop and the
# party settings in /config. Fixed card labels are in capitals where the card draws them as written.

