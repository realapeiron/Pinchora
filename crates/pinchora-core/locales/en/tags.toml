full = "This server has {max} custom commands already, the most there can be. Remove one first."
new-title = "New /tag {name}"
edit-title = "Edit /tag {name}"
hint-many = "This command has {count} replies; this changes the first. The rest are on the dashboard."
hint = "Up to {max} characters. {user} {args} {1} and more are filled in."
reply-label = "Reply"
