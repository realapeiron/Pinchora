# /tag, /customcommand and the checks on a custom command's text.

[settings-error]
tag-no-reply = "Write at least one reply."
tag-too-many-replies = "A command has at most {max} replies; one is picked at random."
tag-reply-empty = "Reply {number} is empty."
tag-reply-long = "Reply {number} is {length} characters; a reply is at most {max}."
tag-cooldown-range = "A cooldown goes from 0 to {max} seconds."
tag-cooldown-actions = "With actions, a member waits at least {min} seconds between uses: set the cooldown to {min} or more, or remove the actions."
tag-name = "A name is 1 to {max} characters: lowercase letters, numbers, `-` and `_`, starting with a letter or number."
tag-reserved = "That name belongs to one of Pinchora's own commands."
tag-description = "A description is at most {max} characters."

[tag]
