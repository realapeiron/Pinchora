# /config summaries, /config xp, the server log, and what a server's own events say by default.

[cfg]
party-current = "Party games filter: {summary}"
critters-off = "**off** · turn it on with `/config critters enabled:true`"
critters-channel = "**on** · drops land in {channel}, where chat counts"
critters-anywhere = "**on** · drops land in whichever channel is busy"
critters-both = "Pick a channel or `anywhere`, not both."
critters-current = "Critter drops: {summary}"
on = "on"
off = "off"
not-set = "not set"
title = "Server settings"
welcome-cards = "Welcome cards"
welcome-value = "**{state}** · {channel}\n> {message}"
leveling = "Leveling"
leveling-value = "**{state}** · level-ups {summary}\n> {message}"
levelup-off = "are off"
levelup-dm = "arrive by direct message"
levelup-current = "in the channel the member chatted in"
levelup-channel = "in {channel}"
xp-rules = "XP rules and voice XP"
xp-value = "{voice}\n> Multipliers: `/config xp show`"
level-roles = "Level roles"
level-roles-value = "**{mode}** · set up with `/config level-roles`"
stack = "stack"
replace = "replace"
server-points = "Server points"
points-value = "**{state}** · {emoji} **{name}** per message, {min} to {max}\n> Spend them in `/store`; add roles with `/config store`"
join-role = "Join role"
goodbye = "Goodbye"
server-log = "Server log"
suggestions = "Suggestions"
critter-drops = "Critter drops"
party-strict = "**strict** · mild words and name-calling are blocked too"
party-normal = "**normal** · strong words and slurs are blocked · `/config partygames strict:true` blocks more"
party-games = "Party games"
your-server = "your server"
join-role-on = "**on** · {role}"
join-role-off = "**off** · pick a role with `/config join-role`"
goodbye-on = "**on** · {channel}\n> {message}"
goodbye-off = "**off** · pick a channel with `/config goodbye`"
log-on = "**on** · {channel}"
log-off = "**off** · pick a channel with `/config log`"
log-events = "{head}\n> joins and leaves {members} · name changes {names} · bans {bans} · voice {voice} · more with `/config log-events`"
join-role-both = "Pick a role or `off`, not both."
join-role-set = "New members now get {role} when they join. Bots are skipped."
join-role-cleared = "New members no longer get a role."
join-role-current = "Join role: {summary}"
goodbye-alone = "Use `off` on its own."
goodbye-current = "Goodbye messages: {summary}"
log-both = "Pick a channel or `off`, not both."
log-current = "Server log: {summary}"

[xp]
no-xp = "{subject} · **no XP**"
multiplied = "{subject} · **×{multiplier}**"
voice-summary = "**{state}** · {amount} XP a minute with company, not while muted and deafened or in the AFK channel"
voice-leveling-off = "\n> Leveling is off, so nobody earns XP. Turn it on with `/config leveling`."
pick-one = "Pick a channel **or** a role to set the multiplier for."
normal-again = "{subject} earns normal XP and points again."
rules-full = "A server can have {max} XP rules. Remove one with `/config xp clear` first."
none-earned = "{subject} now earns **no XP and no points** here."
now-earns = "{subject} now earns **×{multiplier}** XP and points."
no-rules = "There were no XP rules to clear."
cleared = { one = "Cleared **{count}** XP rule. Everything earns normal XP again.", other = "Cleared **{count}** XP rules. Everything earns normal XP again." }
pick-not-both = "Pick a channel **or** a role, not both."
had-none = "{subject} had no multiplier."
channels = "**Channels**\n{list}"
roles = "**Roles**\n{list}"
no-multipliers = "No multipliers yet: every channel and role earns normal XP.\nSet one with `/config xp multiplier`."
rules-title = "XP rules"
voice-field = "Voice XP"
rules-footer = "{count}/{max} rules · a channel's multiplier times the member's highest role multiplier; a no-XP role always wins · a thread or post follows its channel, a channel its category, unless it has its own · server XP and points only, global XP stays normal"
voice-hint = "\n> Members already in a voice channel start earning when they next join, move, mute or unmute."
voice-title = "Voice XP"

# What the bot says when a server wrote no message of its own: the same text as the DEFAULT_* constants.
[events]
default-welcome = "Welcome to **{server}**, {user}!"
default-goodbye = "👋 **{user}** has left **{server}**."
default-levelup = "🎉 {user} reached **level {level}**!"
default-welcome-title = "Welcome"
the-server = "the server"

[card.welcome]
to-member = "to {server} · member #{number}"
to = "to {server}"

[card.goodbye]
title = "Goodbye"
line = "left {server} · {members} members now"

[card.levelup]
title = "LEVEL UP!"
jump = "LV {from} >> {to}"

[log]
bot-joined = "Bot joined"
member-joined = "Member joined"
account-created = "Account created"
bot-left = "Bot left"
member-left = "Member left"
banned = "Member banned"
unbanned = "Member unbanned"
nickname = "Nickname"
username = "Username"
display-name = "Display name"
changed = "{what} changed"
names-changed = "Names changed"
joined-voice = "Joined voice"
left-voice = "Left voice"
moved-voice = "Moved voice"
joined-voice-text = "{member} joined {channel}"
left-voice-text = "{member} left {channel}"
moved-voice-text = "{member} moved from {from} to {to}"
