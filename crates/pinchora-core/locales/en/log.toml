# The server log: its entries (in the server's language) and the /setup moderation log summaries.

[log]
prefix = "Server log: {summary}"
head-on = "**on** · {channel}"
head-off = "**off** · pick a channel with `/setup moderation log`"
category-line = "> {category}: {on}/{total} on · {channel}"
log-channel = "log channel"
no-channel = "no channel"
none = "*none*"
id = "ID {id}"
yes = "yes"
no = "no"
by = "By"
reason = "Reason"
more = { one = "and {count} more", other = "and {count} more" }
the-server = "the server"
for-everyone = "for @everyone"
for = "for {who}"
by-actor = "{target} · by {actor}"

# The log's categories and events, by `LogCategory::key` and `LogEvent::key`.
[log.category]
members = "Members"
messages = "Messages"
roles = "Roles"
channels = "Channels and threads"
voice = "Voice"
moderation = "Moderation"
server = "Server"
invites = "Invites"
emojis = "Emojis and stickers"

[log.event]
member_join = "Member joined"
member_leave = "Member left"
nickname = "Nickname changed"
username = "Username or display name changed"
avatar = "Avatar changed"
message_edit = "Message edited"
message_delete = "Message deleted"
message_bulk_delete = "Messages bulk deleted"
role_create = "Role created"
role_delete = "Role deleted"
role_update = "Role changed"
member_roles = "Member roles changed"
channel_create = "Channel created"
channel_delete = "Channel deleted"
channel_update = "Channel changed"
channel_permissions = "Channel permissions changed"
thread_create = "Thread created"
thread_delete = "Thread deleted"
thread_update = "Thread changed"
voice_join = "Joined voice"
voice_leave = "Left voice"
voice_move = "Moved voice"
voice_moderation = "Server mute or deafen"
voice_self = "Self mute or deafen"
ban = "Member banned"
unban = "Member unbanned"
kick = "Member kicked"
timeout = "Timeout given or removed"
server_update = "Server settings changed"
invite_create = "Invite created"
invite_delete = "Invite deleted"
emojis = "Emoji added, renamed or removed"
stickers = "Sticker added, changed or removed"

# Members, names, voice and messages (from the gateway).
[log.entry]
bot-joined = "Bot joined"
bot-left = "Bot left"
account-created = "Account created"
names-changed = "Names changed"
changed = "{what} changed"
joined-voice = "{member} joined {channel}"
left-voice = "{member} left {channel}"
moved-voice = "{member} moved from {from} to {to}"
server-voice = "Server voice change"
own-voice = "Voice change"
server-muted = "{member} was server muted in {channel}"
server-unmuted = "{member} was server unmuted in {channel}"
server-deafened = "{member} was server deafened in {channel}"
server-undeafened = "{member} was server undeafened in {channel}"
self-muted = "{member} muted themselves in {channel}"
self-unmuted = "{member} unmuted themselves in {channel}"
self-deafened = "{member} deafened themselves in {channel}"
self-undeafened = "{member} undeafened themselves in {channel}"
edited = "{member} edited [a message]({link}) in {channel}"
before = "Before"
after = "After"
no-text = "*no text*"
deleted-by = "A message by {member} was deleted in {channel}"
deleted = "A message was deleted in {channel}"
message = "Message"
sent = "Sent"
attachments = "Attachments"
bulk = { one = "{count} message was deleted in {channel}", other = "{count} messages were deleted in {channel}" }

[log.name]
nickname = "Nickname"
username = "Username"
display-name = "Display name"

# What changed, from the audit log.
[log.change]
name = "Name"
topic = "Topic"
description = "Description"
nsfw = "Age-restricted"
slowmode = "Slowmode (seconds)"
bitrate = "Bitrate"
user-limit = "User limit"
colour = "Colour"
hoist = "Shown separately"
mentionable = "Mentionable"
archived = "Archived"
locked = "Locked"
code = "Code"
channel = "Channel"
uses = "Uses"
no-limit = "no limit"
expires = "Expires"
never = "never"
after-seconds = "after {count} seconds"
temporary = "Temporary membership"
icon = "**Icon** changed"
vanity = "Vanity link"
afk-channel = "AFK channel"
system-channel = "System channel"
rules-channel = "Rules channel"
nickname = "Nickname"
timed-out-until = "**Timed out** until {when}"
timed-out = "**Timed out**"
timeout-removed = "**Timeout** removed"
given = "Given"
taken = "Taken"
allowed = "Allowed"
denied = "Denied"
permissions = "Permissions"
