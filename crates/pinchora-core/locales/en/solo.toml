got-it = "Got it right"
expired = "This round has expired."
time-up = "⏱️ Time's up for this round!"
already-answered = "You already locked in an answer for this round."
locked = "🔒 Locked in **{letter}**. The answer comes when time is up!"
and-more = "and {more} more"
nobody-answered = "Nobody answered this time."
nobody-right = "Nobody got it this time."
reveal = "🧠 Time's up! **{answered}** answered, the answer was **{answer}**."

# /Pixel Picross
[picross]
share = "Share result"
new-puzzle = "New puzzle"
row = "Row {number}"
pick-row = "Pick a row to fill in"
row-cells = "Filled cells in row {number}"
mark-cells = "Mark cells"
check = "Check ({left} left)"
title-daily = "Daily picross #{number}"
title-practice = "Practice picross"
subtitle-solved = "Solved!"
subtitle-progress = "{count} of {total}"
footer-daily = "A new puzzle every day"
footer-practice = "Press New puzzle for another"
footer-wrong = { one = "{count} wrong cell", other = "{count} wrong cells" }
footer-pick = "Pick a row, then its filled cells"
found = "You found a **{name}**! {note}"
how-to = "Each number is a run of filled cells in its row or column, in order, with a gap between runs. Pick a row and tick its filled cells, or **Mark cells** to type them (`A1 B3-B7 -C2`; a dash clears).\n**Check** says how many of your marks are wrong, not which ({max} times a puzzle), and a puzzle you checked pays less.\n{note}"
board-expired = "This board has expired."
button-expired = "This button has expired."
menu-expired = "This menu has expired."
form-expired = "This form has expired."
not-yours = "This puzzle isn't yours. Start one with `/play picross`!"
daily-ended = "That puzzle has ended. Start today's with `/play picross`!"
practice-ended = "That practice puzzle has ended. Start another with `/play picross`!"
no-checks = "You have used every check on this puzzle."
no-mistakes = "No mistakes so far."
mistakes = { one = "**{count}** of your marks is not part of the picture.", other = "**{count}** of your marks are not part of the picture." }
checks-left = { one = "{count} check left.", other = "{count} checks left." }
finished = "This puzzle is finished. Start another with `/play picross`!"
cells-label = "Cells"
cells-help = "Cells to fill (A1), runs along a row or column (B3-B7), a dash in front clears"
unreadable = "I couldn't read that. Use cells like `A1`, runs along one row or column like `B3-B7`, and a dash in front to clear: `-C2`."
board-changed = "The board changed while you marked. Try again."
replayed = "(You solved today's puzzle before deleting your data, so it pays nothing again.)"
paid-daily = { one = "+**{shells}** shells, a streak of **{count}** day!", other = "+**{shells}** shells, a streak of **{count}** days!" }
paid-daily-checked = { one = "+**{shells}** shells (less, because you checked), a streak of **{count}** day!", other = "+**{shells}** shells (less, because you checked), a streak of **{count}** days!" }
paid = "+**{paid}** shells!"
limit-reached = "(Today's reward limit for practice is reached.)"
already-shared = "You already shared this result."
shared = "🧩 {user} solved the daily Pixel Picross #{number}! 🔥 {streak} day streak"

