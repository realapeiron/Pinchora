[advisories]
version = 2

[licenses]
version = 2
include-dev = true
unused-allowed-license = "deny"
# SPDX choices present in Cargo.lock's resolved dependencies; no blanket allow.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Skip only packages explicitly marked publish = false; dependencies remain checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
