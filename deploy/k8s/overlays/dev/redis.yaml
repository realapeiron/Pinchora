# Throwaway Redis for the dev overlay (gateway session store, queues, caches).
apiVersion: v1
kind: Service
metadata:
  name: pinchora-redis
  labels:
    app.kubernetes.io/name: pinchora-redis
    app.kubernetes.io/part-of: pinchora
spec:
  selector:
    app.kubernetes.io/name: pinchora-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pinchora-redis
  labels:
    app.kubernetes.io/name: pinchora-redis
    app.kubernetes.io/part-of: pinchora
spec:
  serviceName: pinchora-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pinchora-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinchora-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--save", "60", "1"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
